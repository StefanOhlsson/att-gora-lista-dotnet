name: Backend CI
on:
  push:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - run: dotnet restore backend/AttGoraLista.sln
      - run: dotnet build backend/AttGoraLista.sln --no-restore --configuration Release
      - run: dotnet test backend/AttGoraLista.sln --no-build --configuration Release
